[package]
name = "iced_font_awesome"
description = "Font Awesome component for Iced"
homepage = "https://github.com/danielmbomfim/iced_font_awesome"
repository = "https://github.com/danielmbomfim/iced_font_awesome"
keywords = ["gui", "iced", "icons"]
categories = ["gui"]
readme = "README.md"
authors = ["Daniel M. Bomfim"]
version = "0.4.2"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
iced = { git = "https://github.com/crbrz/iced.git", branch="patch", features = ["advanced"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[features]
default = ["v7"]
v6 = []
v7 = []
